[workspace]
members = ["crates/kolibri-core", "crates/kolibri-policy", "crates/kolibri-runtime-shadow"]
resolver = "2"

[workspace.package]
version = "2.1.0"
edition = "2024"
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
