[workspace]
members = [
    "crates/kolibri-estimates",
    "services/estimate-engine",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
axum = { version = "=0.8.6", features = ["http1", "json", "tokio"] }
num-bigint = "=0.4.6"
num-traits = "=0.2.19"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tokio = { version = "=1.52.3", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "=0.5.2", features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"
