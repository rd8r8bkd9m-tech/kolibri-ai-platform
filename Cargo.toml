[workspace]
members = [
  "crates/kolibri-core",
  "services/task-shadow"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "UNLICENSED"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
