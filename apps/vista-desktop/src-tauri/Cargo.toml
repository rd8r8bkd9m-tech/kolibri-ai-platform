[package]
name = "vista-desktop"
version = "11.1.0"
description = "Vista OS native desktop shell"
authors = ["Vista OS"]
edition = "2021"
license = "Proprietary"

[lib]
name = "vista_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
vista-core = { path = "../../../crates/vista-core" }
vista-policy = { path = "../../../crates/vista-policy" }
