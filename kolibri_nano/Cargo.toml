[package]
name = "kolibri_nano"
version = "0.1.0"
edition = "2021"
description = "Kolibri AI — Local intelligence core: memory, traces, patterns, personal core"
license = "Proprietary"

[lib]
name = "kolibri_nano"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = "0.4"
thiserror = "1"
anyhow = "1"

# PyO3 — uncomment when building Python extension
# pyo3 = { version = "0.22", features = ["extension-module"] }

# Axum — uncomment when building standalone Rust HTTP service
# axum = "0.7"
# tokio = { version = "1", features = ["full"] }

# WASM — uncomment for browser/wasm target
# wasm-bindgen = "0.2"
# serde-wasm-bindgen = "0.6"

[dev-dependencies]
tempfile = "3"
