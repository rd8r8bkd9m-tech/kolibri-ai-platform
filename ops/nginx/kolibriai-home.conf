server {
    server_name kolibriai.ru www.kolibriai.ru;
    client_max_body_size 64m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API namespaces must never fall through to the SPA. The exact namespace
    # roots are not API operations, so fail with the same bounded JSON shape as
    # the backend instead of returning index.html.
    location = /api {
        default_type application/json;
        return 404 '{"detail":"api_route_not_found"}';
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location = /v1 {
        default_type application/json;
        return 404 '{"detail":"api_route_not_found"}';
    }

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location ^~ /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Vite assets are content-addressed. A missing hash is a real 404; serving
    # index.html here causes the browser's strict module MIME failure and can
    # keep a stale Shell unusable after an atomic release switch.
    location ^~ /assets/ {
        root /opt/kolibri-ai/current/frontend/dist;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Public root assets have explicit boundaries too. Future manifests remain
    # a clean 404 until they are present in the signed frontend payload.
    location = /kolibri-bird.png {
        root /opt/kolibri-ai/current/frontend/dist;
        try_files $uri =404;
        default_type image/png;
        expires 7d;
    }

    location = /sw.js {
        root /opt/kolibri-ai/current/frontend/dist;
        try_files $uri =404;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location = /manifest.webmanifest {
        root /opt/kolibri-ai/current/frontend/dist;
        try_files $uri =404;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location = /manifest.json {
        root /opt/kolibri-ai/current/frontend/dist;
        try_files $uri =404;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location = /favicon.ico {
        root /opt/kolibri-ai/current/frontend/dist;
        try_files $uri =404;
        default_type image/x-icon;
        expires 7d;
    }

    location = /telegram-miniapp.html {
        root /opt/kolibri-ai/current/frontend/dist;
        try_files $uri =404;
        default_type text/html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location = /index.html {
        root /opt/kolibri-ai/current/frontend/dist;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        root /opt/kolibri-ai/current/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/kolibriai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kolibriai.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 302 https://kolibriai.ru$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name kolibriai.ru www.kolibriai.ru;
    return 301 https://$host$request_uri;
}
