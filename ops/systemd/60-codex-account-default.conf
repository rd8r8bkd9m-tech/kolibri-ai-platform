[Service]
# Home's owner-authorized Codex session is the authority for the selected
# account model.  A stale provider-specific model override can make the text
# route appear healthy while disabling built-in tools such as image generation.
Environment=CODEX_CLI_MODEL=
Environment=CODEX_CLI_IMAGE_MODEL=
# ``ProtectHome=read-only`` remains enabled on the backend unit.  Grant the
# image worker only its verified output root; credentials and the rest of the
# owner home stay read-only.
ReadWritePaths=/home/ladik/.codex/generated_images
