[Service]
Environment=PYTHONPATH=/usr/local/lib/kolibri
Environment=KOLIBRI_FACTORY_CONTROL_URL=http://127.0.0.1:9101
Environment=KOLIBRI_FACTORY_CONTROL_URLS=
Environment=PYTHONDONTWRITEBYTECODE=1
SupplementaryGroups=kolibri-agent
ExecStart=
ExecStart=/usr/bin/python3 -B /usr/local/bin/kolibri-agent-host --control-url http://127.0.0.1:9101 --node-id home-live --agent-id director-home-live --capabilities home,orchestrator,telegram,generic_implementation,implementation,read_only_probe --work-root /home/ladik/.kolibri-agent/worktrees --artifact-root /home/ladik/.kolibri-agent/artifacts --heartbeat-interval 10 --lease-refresh 5 --max-inflight 1
