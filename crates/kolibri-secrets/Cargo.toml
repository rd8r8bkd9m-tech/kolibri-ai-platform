[package]
name = "kolibri-secrets"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
kolibri-core = { path = "../kolibri-core" }
