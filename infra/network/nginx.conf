server {
    listen 80;
    server_name _;

    location / {
        root /opt/kolibri-ai/frontend/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Explicit private app entrypoint: force auth gate before SPA fallback.
    location ^~ /app {
        auth_request /api/v1/auth/me;
        error_page 401 403 = @kolibri_app_login;
        root /opt/kolibri-ai/frontend/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location @kolibri_app_login {
        return 302 /login?return_url=$request_uri;
    }

    # Keep compatibility with older regex-based locations in mixed nginx sets.
    location ~ ^/app(?:/.*)?$ {
        auth_request /api/v1/auth/me;
        error_page 401 403 = @kolibri_app_login;
        root /opt/kolibri-ai/frontend/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location = /api/v1/auth/session {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @kolibri_app_login {
        return 302 /login?return_url=$request_uri;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /cluster/ {
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
