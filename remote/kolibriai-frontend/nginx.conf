server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files /index.html =404;
    }

    location = /mobile-menu-fix.js {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files /mobile-menu-fix.js =404;
    }

    location = /sw.js {
        expires epoch;
        add_header X-Kolibri-SW "no-store" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files /sw.js =404;
    }

    location = /api/providers {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '[{"name":"kolibri","available":true,"status":"online","model":"auto","provider":"auto","api_surface":"auto_router","description":"Auto provider: Kimi, Qwen, Mimo and Kolibri fallback."},{"name":"mimo","available":true,"status":"online","model":"mimo-auto"},{"name":"kimi","available":true,"status":"online","model":"kimi-k2","api_surface":"chat_completions","auth_required":true},{"name":"qwen","available":true,"status":"online","model":"qwen-max","api_surface":"chat_completions","auth_required":true},{"name":"openai","available":false,"status":"offline"},{"name":"anthropic","available":false,"status":"offline"},{"name":"formulalm","available":false,"status":"disabled","lab_only":true,"production_generation":false},{"name":"reranker","available":true,"status":"online","description":"Frozen Qwen + FormulaLM enhancement"}]';
    }

    location = /api/factory/status {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"product":"Колибри","runtime":"compatibility_gateway","simulation_running":false,"paused":false,"nodes":{"total":0,"states":{}},"agents":{"total":0,"states":{},"active":0},"tasks":{"total":0,"states":{},"queued":0,"running":0,"completed":0,"cancelled":0,"retry_scheduled":0,"failed":0,"dead_letter":0},"leases":{"active":0},"attempts":{"total":0},"capacity":{"mailbox_capacity_per_agent":0,"total_task_capacity":0,"global_max_inflight":1000,"max_inflight_per_agent":1,"max_inflight_per_node":50},"bird_state":{"state":"ready","queued_tasks":0,"running_tasks":0,"active_agents":0,"quarantined_nodes":0,"approval_required":false,"menu":["Чат","Библиотека","Сметы","Документы","Агенты","Задачи","Серверы","Инциденты","Настройки"]},"approval_required":false,"audit_events":0}';
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
