name: Kolibri V3

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
      - "factory/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kolibri-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.18.0"
  PYTHON_VERSION: "3.12"
  RUST_TOOLCHAIN: "1.85.0"

jobs:
  web:
    name: V3 web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kolibri-v3
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: kolibri-v3/package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Test
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

  backend:
    name: V3 backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kolibri-v3
    env:
      PYTHONPATH: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            kolibri-v3/backend/requirements.txt
            kolibri-v3/backend/requirements-dev.txt

      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run the complete backend test suite
        run: python -m pytest -q backend/tests

  contracts:
    name: V1 JSON contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kolibri-v3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema[format-nongpl]==4.25.1"

      - name: Check self-contained contract manifest
        run: python server/generate_contract_manifest.py --check

      - name: Validate schemas and examples without repository scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema.validators import validator_for
          from referencing import Registry, Resource

          root = Path("contracts/v1")
          schema_paths = sorted(root.rglob("*.schema.json"))
          example_paths = sorted(root.rglob("examples/*.json"))
          if not schema_paths:
              raise SystemExit("no JSON schemas found under contracts/v1")
          if not example_paths:
              raise SystemExit("no JSON examples found under contracts/v1")

          schemas_by_path = {}
          schemas_by_uri = {}
          schemas_by_logical_id = {}
          for path in schema_paths:
              schema = json.loads(path.read_text(encoding="utf-8"))
              validator_for(schema).check_schema(schema)

              uri = schema.get("$id")
              if not isinstance(uri, str) or not uri:
                  raise ValueError(f"{path}: schema has no non-empty $id")
              if uri in schemas_by_uri:
                  raise ValueError(f"{path}: duplicate schema $id {uri!r}")

              logical_id = (
                  schema.get("properties", {})
                  .get("schema_id", {})
                  .get("const")
              )
              if logical_id is not None:
                  if logical_id in schemas_by_logical_id:
                      raise ValueError(
                          f"{path}: duplicate logical schema_id {logical_id!r}"
                      )
                  schemas_by_logical_id[logical_id] = (path, schema)

              schemas_by_path[path] = schema
              schemas_by_uri[uri] = schema

          registry = Registry().with_resources(
              (
                  uri,
                  Resource.from_contents(schema),
              )
              for uri, schema in schemas_by_uri.items()
          )

          def schema_for_example(path, instance):
              logical_id = (
                  instance.get("schema_id")
                  if isinstance(instance, dict)
                  else None
              )
              if logical_id in schemas_by_logical_id:
                  return schemas_by_logical_id[logical_id]

              name = path.stem
              if name.startswith("valid-"):
                  name = name.removeprefix("valid-")
              elif name.startswith("invalid-"):
                  invalid_name = name.removeprefix("invalid-")
                  domain_candidates = [
                      (schema_path, schema)
                      for schema_path, schema in schemas_by_path.items()
                      if schema_path.parent == path.parent.parent
                  ]
                  prefix_matches = [
                      (schema_path, schema)
                      for schema_path, schema in domain_candidates
                      if (
                          invalid_name
                          == schema_path.name.removesuffix(".schema.json")
                          or invalid_name.startswith(
                              schema_path.name.removesuffix(".schema.json")
                              + "-"
                          )
                      )
                  ]
                  if prefix_matches:
                      return max(
                          prefix_matches,
                          key=lambda item: len(item[0].name),
                      )
                  invalid_aliases = {
                      "command": "command-envelope.schema.json",
                  }
                  alias = invalid_name.split("-", 1)[0]
                  alias_path = path.parent.parent / invalid_aliases.get(
                      alias,
                      "",
                  )
                  if alias_path in schemas_by_path:
                      return alias_path, schemas_by_path[alias_path]
                  raise ValueError(
                      f"{path}: cannot determine target schema for "
                      "intentionally invalid fixture"
                  )

              direct_path = path.parent.parent / f"{name}.schema.json"
              if direct_path in schemas_by_path:
                  return direct_path, schemas_by_path[direct_path]

              satisfying_schemas = []
              for schema_path, schema in schemas_by_path.items():
                  validator_class = validator_for(schema)
                  validator = validator_class(
                      schema,
                      registry=registry,
                      format_checker=validator_class.FORMAT_CHECKER,
                  )
                  if not list(validator.iter_errors(instance)):
                      satisfying_schemas.append((schema_path, schema))
              if len(satisfying_schemas) == 1:
                  return satisfying_schemas[0]

              domain_schemas = [
                  (schema_path, schema)
                  for schema_path, schema in schemas_by_path.items()
                  if schema_path.parent == path.parent.parent
              ]
              if len(domain_schemas) == 1:
                  return domain_schemas[0]

              raise ValueError(
                  f"{path}: cannot determine target schema; "
                  "add an explicit schema_id or a same-name schema"
              )

          valid_count = 0
          invalid_count = 0
          for path in example_paths:
              instance = json.loads(path.read_text(encoding="utf-8"))
              schema_path, schema = schema_for_example(path, instance)
              validator_class = validator_for(schema)
              validator = validator_class(
                  schema,
                  registry=registry,
                  format_checker=validator_class.FORMAT_CHECKER,
              )
              errors = sorted(
                  validator.iter_errors(instance),
                  key=lambda error: [str(part) for part in error.absolute_path],
              )

              if path.name.startswith("invalid-"):
                  if not errors:
                      raise ValueError(
                          f"{path}: invalid fixture unexpectedly satisfies {schema_path}"
                      )
                  invalid_count += 1
                  continue

              if errors:
                  details = "; ".join(
                      f"{list(error.absolute_path)}: {error.message}"
                      for error in errors[:5]
                  )
                  raise ValueError(
                      f"{path}: does not satisfy {schema_path}: {details}"
                  )
              valid_count += 1

          print(
              f"validated {len(schema_paths)} schemas, "
              f"{valid_count} valid examples, and "
              f"{invalid_count} intentionally invalid examples"
          )
          PY

  estimate-kernel:
    name: Rust estimate kernel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kolibri-v3/packages/estimate-kernel-rs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" \
            --profile minimal \
            --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            kolibri-v3/packages/estimate-kernel-rs/target/
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('kolibri-v3/packages/estimate-kernel-rs/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Check formatting
        run: cargo fmt --check

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  mobile:
    name: Expo mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kolibri-v3/apps/kolibri-mobile
    env:
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: kolibri-v3/apps/kolibri-mobile/package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test native contracts
        run: npm test

      - name: Expo Doctor
        run: npx --yes expo-doctor@1.20.1

  mobile-export-smoke:
    name: Expo export (${{ matrix.platform }})
    needs: mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ios
          - android
    defaults:
      run:
        working-directory: kolibri-v3/apps/kolibri-mobile
    env:
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: kolibri-v3/apps/kolibri-mobile/package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Export bundle
        run: npm run export:${{ matrix.platform }}

  portable-release:
    name: Canonical portable release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: kolibri-v3
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout clean release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: kolibri-v3/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            kolibri-v3/backend/requirements.txt
            kolibri-v3/backend/requirements-dev.txt

      - name: Install release test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Check self-contained contract manifest
        run: python server/generate_contract_manifest.py --check

      - name: Enforce the single canonical V3 release lane
        run: |
          python deploy/portable/release-manifest.py audit-repository \
            --repo .. \
            --commit HEAD

      - name: Test migrations and portable release scripts
        run: |
          set -euo pipefail
          python -m pytest -q \
            backend/tests/test_access_policy_repair_migration.py \
            backend/tests/test_dev_preflight.py \
            backend/tests/test_mobile_auth_migration.py \
            backend/tests/test_platform_admin_migration.py \
            backend/tests/test_product_entitlement_projection.py \
            backend/tests/test_release_monitor.py \
            backend/tests/test_service_tier_access_migration.py \
            backend/tests/test_trusted_agent_control_migration.py \
            backend/tests/test_trusted_agent_leases.py
          python -m unittest discover \
            -s deploy/workers/tests \
            -p 'test_*.py'
          node --test \
            tests/dev-runtime-launch.test.mjs \
            tests/portable-release.test.mjs \
            tests/release-observability.test.mjs

      - name: Render and verify production operation units
        shell: bash
        run: |
          set -euo pipefail
          unit_root="$RUNNER_TEMP/kolibri-v3-systemd"
          runtime_root="$unit_root/runtime"
          data_root="$unit_root/data"
          backup_root="$unit_root/backups"
          mkdir -p \
            "$runtime_root/backend/venv/bin" \
            "$data_root" \
            "$backup_root"
          ln -s "$(command -v python)" \
            "$runtime_root/backend/venv/bin/python"

          python deploy/portable/install-contract.py render-operations \
            --output-dir "$unit_root" \
            --instance kolibri-v3 \
            --current-link "$runtime_root" \
            --data-root "$data_root" \
            --backup-root "$backup_root" \
            --backend-port 8002 \
            --frontend-port 3103 \
            --public-origin https://kolibriai.example \
            --release-id kolibri-v3-0123456789ab-abcdef012345 \
            --release-commit 0123456789abcdef0123456789abcdef01234567 \
            --expected-schema 44 \
            --systemctl "$(command -v systemctl)" \
            --journalctl "$(command -v journalctl)" \
            --database-helper \
              "$GITHUB_WORKSPACE/kolibri-v3/deploy/portable/database-rehearsal.py"

          for role in backend frontend product-run-worker; do
            printf '%s\n' \
              '[Unit]' \
              "Description=Kolibri V3 CI dependency stub ($role)" \
              '[Service]' \
              'Type=oneshot' \
              'ExecStart=/usr/bin/true' \
              > "$unit_root/kolibri-v3-$role.service"
          done

          systemd-analyze verify \
            "$unit_root/kolibri-v3-backend.service" \
            "$unit_root/kolibri-v3-frontend.service" \
            "$unit_root/kolibri-v3-product-run-worker.service" \
            "$unit_root/kolibri-v3-release-monitor.service" \
            "$unit_root/kolibri-v3-release-monitor.timer" \
            "$unit_root/kolibri-v3-database-backup.service" \
            "$unit_root/kolibri-v3-database-backup.timer"

      - name: Build and verify immutable canonical archive
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/kolibri-v3-release"
          release_output="$RUNNER_TEMP/kolibri-v3-release.env"
          ./deploy/portable/build-release.sh "$release_dir" |
            tee "$release_output"
          release_archive="$(
            awk -F= '$1 == "release_archive" {print $2; exit}' \
              "$release_output"
          )"
          test -n "$release_archive"
          python deploy/portable/release-manifest.py verify \
            --archive "$release_archive"
          ./deploy/portable/smoke-test.sh "$release_archive"
