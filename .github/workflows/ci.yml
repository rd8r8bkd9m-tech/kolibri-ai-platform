name: Kolibri CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
      - "factory/**"

permissions:
  contents: read

jobs:
  kolibri-shell:
    name: kolibri-shell
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: apps/kolibri-shell-next/package-lock.json

      - name: Install locked dependencies
        working-directory: apps/kolibri-shell-next
        run: npm ci

      - name: Lint
        working-directory: apps/kolibri-shell-next
        run: npm run lint

      - name: Test
        working-directory: apps/kolibri-shell-next
        run: npm test

      - name: Build
        working-directory: apps/kolibri-shell-next
        run: npm run build

  rust:
    name: rust-1.97
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Verify pinned Rust workspace contract
        id: rust_contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          workspace = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))
          toolchain = tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text(encoding="utf-8"))

          package = workspace["workspace"]["package"]
          channel = toolchain["toolchain"]["channel"]
          expected_version = package["rust-version"]
          expected_parts = expected_version.split(".")
          expected_channel = expected_version if len(expected_parts) == 3 else f"{expected_version}.0"

          assert package["edition"] == "2024", "workspace edition must remain 2024"
          assert channel == expected_channel, (
              f"rust-toolchain channel {channel!r} does not match "
              f"workspace rust-version {expected_version!r}"
          )
          assert toolchain["toolchain"]["profile"] == "minimal", (
              "rust-toolchain.toml must use the minimal profile"
          )
          assert set(toolchain["toolchain"]["components"]) >= {"clippy", "rustfmt"}, (
              "rust-toolchain.toml must pin clippy and rustfmt"
          )

          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"channel={channel}\n")
          print(f"validated Rust {channel}, edition {package['edition']}")
          PY

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${{ steps.rust_contract.outputs.channel }}" \
            --profile minimal \
            --component clippy \
            --component rustfmt
          rustup override set "${{ steps.rust_contract.outputs.channel }}"
          rustc --version --verbose
          cargo --version --verbose

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust check
        run: cargo check --locked --workspace --all-targets

      - name: Rust clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --locked --workspace --all-targets

  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version-file: ".python-version"

      - name: Python syntax compile
        shell: bash
        run: |
          set -euo pipefail
          paths=()
          for path in backend infra scripts; do
            if [ -d "$path" ]; then
              paths+=("$path")
            fi
          done
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "::notice::skipped Python compile: no backend/infra/scripts directories present"
            exit 0
          fi
          python -m compileall -q "${paths[@]}"

      - name: Pytest tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find . -path './.git' -prune -o -path './node_modules' -prune -o -path './frontend/node_modules' -prune -o -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "::notice::skipped pytest: no pytest test files found"
            exit 0
          fi
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then
            python -m pip install -r backend/requirements.txt
          fi
          python -m pip install pytest
          python -m pytest -q

      - name: Set up Node
        if: ${{ hashFiles('frontend/package.json') != '' }}
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: ".node-version"

      - name: Verify canonical runtime pins
        if: ${{ hashFiles('frontend/package.json') != '' }}
        run: python scripts/check_runtime_version_pins.py --check-installed

      - name: JavaScript and TypeScript checks
        if: ${{ hashFiles('frontend/package.json') != '' }}
        shell: bash
        working-directory: frontend
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)"; then
            npm run build
          else
            echo "::notice::skipped frontend build: package.json has no build script"
          fi

          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.lint ? 0 : 1)"; then
            if ls eslint.config.* .eslintrc* >/dev/null 2>&1; then
              npm run lint
            else
              echo "::notice::skipped frontend lint: lint script exists but no ESLint config is tracked"
            fi
          else
            echo "::notice::skipped frontend lint: no lint script"
          fi

          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.typecheck ? 0 : 1)"; then
            if [ -f tsconfig.json ]; then
              npm run typecheck
            else
              echo "::notice::skipped frontend typecheck: typecheck script exists but no tsconfig.json is tracked"
            fi
          else
            echo "::notice::skipped frontend typecheck: no typecheck script"
          fi

          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
            npm test
          else
            echo "::notice::skipped frontend tests: no test script"
          fi

      - name: JavaScript and TypeScript checks skipped
        if: ${{ hashFiles('frontend/package.json') == '' }}
        run: |
          echo "::notice::skipped frontend checks: frontend/package.json is absent"

      - name: JSON and YAML validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess

          raw = subprocess.check_output(["git", "ls-files", "*.json"], text=True)
          files = [line for line in raw.splitlines() if line]
          if not files:
              print("::notice::skipped JSON validation: no tracked JSON files")
          else:
              for path in files:
                  with open(path, "r", encoding="utf-8") as f:
                      json.load(f)
              print(f"validated {len(files)} JSON files")
          PY
          mapfile -t yaml_files < <(git ls-files '*.yml' '*.yaml')
          if [ "${#yaml_files[@]}" -eq 0 ]; then
            echo "::notice::skipped YAML validation: no tracked YAML files"
          elif command -v ruby >/dev/null 2>&1; then
            ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path) }' "${yaml_files[@]}"
            echo "validated ${#yaml_files[@]} YAML files"
          else
            echo "::notice::skipped YAML validation: ruby YAML parser unavailable on runner"
          fi

      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          patterns = [
              ("private_key", re.compile(r"-----BEGIN (?:RSA |DSA |EC |OPENSSH |PGP )?PRIVATE KEY-----")),
              ("github_token", re.compile(r"\bgh[pousr]_[A-Za-z0-9_]{30,}\b")),
              ("openai_key", re.compile(r"\bsk-[A-Za-z0-9]{32,}\b")),
              ("aws_access_key", re.compile(r"\bAKIA[0-9A-Z]{16}\b")),
              ("generic_assignment", re.compile(r"(?i)\b(api[_-]?key|secret|token|password)\s*[:=]\s*['\"]?[A-Za-z0-9_./+=-]{20,}")),
          ]

          raw = subprocess.check_output(["git", "ls-files", "-z"])
          files = [pathlib.Path(p.decode()) for p in raw.split(b"\0") if p]
          findings = []
          for path in files:
              if any(part in {"node_modules", ".git", ".venv", "venv", "__pycache__"} for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for name, pattern in patterns:
                  if pattern.search(text):
                      findings.append(f"{path}:{name}")

          if findings:
              print("Secret scan failed. Matched files/patterns only; secret values are not printed.")
              for item in findings:
                  print(item)
              sys.exit(1)

          print(f"secret scan passed across {len(files)} tracked files")
          PY

      - name: Production secret path guard
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            git fetch origin "$BASE_REF" --depth=1
            compare_ref="origin/${BASE_REF}...HEAD"
          elif [ -n "${BEFORE_SHA:-}" ] && ! printf '%s' "$BEFORE_SHA" | grep -Eq '^0+$'; then
            compare_ref="${BEFORE_SHA}..HEAD"
          else
            echo "::notice::skipped production secret path guard: no comparable base commit"
            exit 0
          fi
          mapfile -t changed < <(git diff --name-only "$compare_ref")
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "no changed files in comparison"
            exit 0
          fi
          blocked=()
          for path in "${changed[@]}"; do
            case "$path" in
              .env|.env.*|*.env|*.pem|*.key|*.p12|*.pfx|*auth.json|*.kube/config|.ssh/*|*.sqlite|*.db)
                blocked+=("$path")
                ;;
            esac
          done
          if [ "${#blocked[@]}" -gt 0 ]; then
            printf 'Production secret path guard failed. Blocked paths:\n'
            printf '%s\n' "${blocked[@]}"
            exit 1
          fi
          echo "production secret path guard passed"

      - name: Local component smoke
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          backend = Path("backend/main.py")
          if backend.exists():
              text = backend.read_text(encoding="utf-8")
              assert "FastAPI" in text, "backend/main.py does not declare FastAPI usage"
              assert "/api/health" in text or "/health" in text, "backend has no health-like route"
              print("backend smoke passed")
          else:
              print("::notice::skipped backend smoke: backend/main.py is absent")

          frontend = Path("frontend/package.json")
          if frontend.exists():
              print("frontend smoke passed: frontend/package.json present")
          else:
              print("::notice::skipped frontend smoke: frontend/package.json is absent")
          PY
