name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kolibri-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"
          cache-dependency-path: kolibri-v2/package-lock.json
      - run: node --version | grep -Fx "v24.18.0"
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kolibri-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"
          cache: "pip"
      - run: python --version | grep -Fx "Python 3.14.6"
      - run: pip install --require-hashes -r requirements.lock
      - run: python -m pytest app/tests/ -v

  toolchains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"
      - run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.97.0
      - run: python scripts/verify_toolchains.py

  docker:
    runs-on: ubuntu-latest
    needs: [toolchains, frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
