name: Kolibri V2.1 CI

on:
  push:
    branches: [main, "kolibri-v2.1-home-first"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api-gateway/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/shell/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r services/api-gateway/requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Install frontend dependencies
        working-directory: apps/shell
        run: npm ci --no-audit --no-fund
      - name: Run complete release check
        run: ./scripts/release-check.sh
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kolibri-v2-release-evidence
          path: |
            release-evidence/
            var/e2e-v2.1/
            var/release-check/

  rust-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: kolibri-v2-backend:ci
      - name: Build shell image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: kolibri-v2-shell:ci
