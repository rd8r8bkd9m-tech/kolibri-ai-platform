<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kolibri Superfactory</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0f14;
        --panel: rgba(18, 28, 38, 0.86);
        --line: rgba(255, 255, 255, 0.1);
        --text: #eef7fb;
        --muted: #8ca3b0;
        --accent: #38bdf8;
        --green: #10b981;
        --amber: #f59e0b;
        --red: #ef4444;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          linear-gradient(145deg, rgba(56, 189, 248, 0.16), transparent 34%),
          linear-gradient(315deg, rgba(16, 185, 129, 0.1), transparent 28%),
          var(--bg);
        color: var(--text);
      }
      main { padding: 18px 16px calc(20px + env(safe-area-inset-bottom)); max-width: 760px; margin: 0 auto; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
      h1 { font-size: 22px; line-height: 1.1; margin: 0; letter-spacing: 0; }
      .status-pill { border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; color: var(--muted); font-size: 12px; white-space: nowrap; }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; box-shadow: 0 18px 60px rgba(0, 0, 0, 0.28); }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
      .metric { border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-height: 76px; }
      .metric strong { display: block; font-size: 24px; line-height: 1; margin-bottom: 8px; }
      .metric span { color: var(--muted); font-size: 12px; }
      textarea { width: 100%; min-height: 118px; resize: vertical; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,0.06); color: var(--text); padding: 12px; font: inherit; outline: none; }
      textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18); }
      .row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
      select, button { height: 42px; border-radius: 8px; border: 1px solid var(--line); font: inherit; }
      select { flex: 1; background: rgba(255,255,255,0.06); color: var(--text); padding: 0 10px; }
      button { min-width: 132px; background: var(--accent); color: #061019; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: 0.55; cursor: not-allowed; }
      .list { display: grid; gap: 8px; margin-top: 12px; }
      .item { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; justify-content: space-between; gap: 12px; }
      .item small { color: var(--muted); display: block; margin-top: 3px; }
      .ok { color: var(--green); } .warn { color: var(--amber); } .bad { color: var(--red); }
      .empty, .error, .loading, .success { margin-top: 12px; border-radius: 8px; padding: 12px; border: 1px solid var(--line); color: var(--muted); }
      .error { color: #fecaca; border-color: rgba(239, 68, 68, 0.35); }
      .success { color: #bbf7d0; border-color: rgba(16, 185, 129, 0.35); }
      @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } .row { flex-direction: column; } select, button { width: 100%; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Kolibri Superfactory</h1>
          <div style="color: var(--muted); font-size: 13px; margin-top: 4px;">Задачи, статус флота и артефакты</div>
        </div>
        <div id="auth" class="status-pill">Проверка доступа</div>
      </header>
      <section class="panel">
        <div id="state" class="loading">Загружаю состояние фабрики...</div>
        <div id="dashboard" hidden>
          <div class="grid">
            <div class="metric"><strong id="nodes">0</strong><span>узлов онлайн</span></div>
            <div class="metric"><strong id="queue">0</strong><span>задач в очереди</span></div>
            <div class="metric"><strong id="receiver">-</strong><span>канонический receiver</span></div>
            <div class="metric"><strong id="runner">-</strong><span>маршрут AI</span></div>
          </div>
          <textarea id="objective" placeholder="Например: проверь PR, статус CI и подготовь артефакты"></textarea>
          <div class="row">
            <select id="runnerSelect">
              <option value="codex">Codex</option>
              <option value="mimo">MIMO</option>
              <option value="api">API runner</option>
              <option value="local_llm">Local LLM</option>
            </select>
            <button id="submit">Отправить</button>
          </div>
          <div id="submitState"></div>
          <div id="nodesList" class="list"></div>
        </div>
      </section>
    </main>
    <script>
      const tg = window.Telegram?.WebApp
      tg?.ready()
      tg?.expand()
      const initData = tg?.initData || ""
      const state = document.getElementById("state")
      const dashboard = document.getElementById("dashboard")
      const auth = document.getElementById("auth")
      const submitState = document.getElementById("submitState")
      const headers = () => ({ "Content-Type": "application/json", "X-Telegram-Init-Data": initData })

      async function api(path, options = {}) {
        const res = await fetch(path, { ...options, headers: { ...headers(), ...(options.headers || {}) } })
        const data = await res.json().catch(() => ({}))
        if (!res.ok) throw new Error(data.error || "request_failed")
        return data
      }

      function renderStatus(data) {
        const online = (data.nodes || []).filter(n => n.health === "online").length
        document.getElementById("nodes").textContent = String(online)
        document.getElementById("queue").textContent = String((data.queue || []).length)
        document.getElementById("receiver").textContent = data.receiver?.mode || "-"
        document.getElementById("runner").textContent = (data.runner_policy?.ordered_runners || ["-"])[0]
        const list = document.getElementById("nodesList")
        list.innerHTML = ""
        if (!(data.nodes || []).length) {
          list.innerHTML = '<div class="empty">Флот пока не зарегистрирован в Control Plane.</div>'
        } else {
          for (const node of data.nodes) {
            const item = document.createElement("div")
            item.className = "item"
            item.innerHTML = `<div><strong>${node.node_id || "node"}</strong><small>${(node.capabilities || []).join(", ") || "capabilities не указаны"}</small></div><div class="${node.health === "online" ? "ok" : "bad"}">${node.health || "unknown"}</div>`
            list.appendChild(item)
          }
        }
        state.hidden = true
        dashboard.hidden = false
        auth.textContent = "Доступ подтвержден"
      }

      async function load() {
        if (!initData) {
          state.className = "error"
          state.textContent = "Откройте Mini App из Telegram: требуется initData."
          auth.textContent = "Нет initData"
          return
        }
        try { renderStatus(await api("/v1/superfactory/status")) }
        catch (err) {
          state.className = "error"
          state.textContent = err.message === "forbidden" ? "Нет прав владельца или администратора." : "Не удалось загрузить состояние фабрики."
          auth.textContent = "Доступ закрыт"
        }
      }

      document.getElementById("submit").addEventListener("click", async () => {
        const objective = document.getElementById("objective").value.trim()
        if (!objective) {
          submitState.className = "empty"
          submitState.textContent = "Введите задачу для фабрики."
          return
        }
        submitState.className = "loading"
        submitState.textContent = "Отправляю задачу в Control Plane..."
        try {
          const task = await api("/v1/superfactory/tasks", {
            method: "POST",
            body: JSON.stringify({ objective, runner: document.getElementById("runnerSelect").value }),
          })
          submitState.className = "success"
          submitState.textContent = `Задача принята: ${task.state || "queued"}`
          document.getElementById("objective").value = ""
        } catch (err) {
          submitState.className = "error"
          submitState.textContent = err.message === "forbidden" ? "Нет прав на постановку задач." : "Control Plane не принял задачу."
        }
      })

      load()
    </script>
  </body>
</html>
