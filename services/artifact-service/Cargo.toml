[package]
name = "kolibri-artifact-service"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
