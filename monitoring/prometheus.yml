global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "kolibri-backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: "/metrics"

  - job_name: "kolibri-organism"
    static_configs:
      - targets: ["organism:9001"]
    metrics_path: "/health"

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
