tasks:
  - id: "R1-001"
    priority: "P0"
    day: "D1"
    status: "in_progress"
    title: "Converge on one Product/Data backend"
    exit:
      - "ADR accepted"
      - "release manifest packages kolibri-v3/backend"
      - "no browser route or worker writes a second Product history"
      - "Universal Core and construction.estimates boundary accepted"
      - "construction vertical manifest validates"

  - id: "R1-002"
    priority: "P0"
    day: "D1"
    status: "completed"
    title: "Repair Agent Card selection and provider execution suite"
    exit:
      - "all test_provider_execution.py tests pass"
      - "exact runtime binding proven"
      - "no silent provider fallback"

  - id: "R1-003"
    priority: "P0"
    day: "D1"
    status: "in_progress"
    title: "Add clean-checkout V3 CI"
    exit:
      - "backend suite passes"
      - "web typecheck/tests/build pass"
      - "migration and release-script tests pass"

  - id: "R1-004"
    priority: "P0"
    day: "D1"
    status: "completed"
    title: "Establish the Rust-ready estimate contract boundary"
    exit:
      - "versioned request/result schemas exist"
      - "side-effect-free Rust crate passes fmt, clippy and tests"
      - "shared golden fixture passes"
      - "production authority remains Python until parity gate"

  - id: "R1-005"
    priority: "P0"
    day: "D2"
    status: "completed"
    title: "Integrate browser and native authentication contracts"
    exit:
      - "cookie+CSRF browser flow passes"
      - "bearer AG-UI flow passes"
      - "refresh replay revokes device family"
      - "cross-tenant tests pass"

  - id: "R1-006"
    priority: "P0"
    day: "D2"
    status: "in_progress"
    title: "Prove persistent runtime, durable stream and latency"
    exit:
      - "no new runtime process per message"
      - "resume/cancel/restart pass"
      - "real provider timings saved"

  - id: "R1-007"
    priority: "P1"
    day: "D2"
    status: "in_progress"
    title: "Complete Expo/assistant-ui truth spike"
    release_blocking: false
    blocked_by: "physical iOS and Android runtime evidence"
    exit:
      - "typecheck and expo-doctor pass"
      - "iOS launch passes"
      - "Android launch passes"
      - "no WebView"

  - id: "R1-008"
    priority: "P0"
    day: "D3"
    status: "in_progress"
    title: "Pass the complete R1 user journey"
    exit:
      - "weather passes"
      - "image artifact passes or action is absent"
      - "attachment states pass"
      - "estimate version/edit/conflict passes"
      - "PDF/XLSX/DOCX match one snapshot"

  - id: "R1-009"
    priority: "P0"
    day: "D4"
    status: "in_progress"
    title: "Build immutable production package and observability"
    exit:
      - "one release ID across all processes"
      - "public no-secret release identity and readiness are observable"
      - "clean local production smoke passes"
      - "health/readiness/liveness and alerts pass"
      - "archive secret scan passes"

  - id: "R1-010"
    priority: "P0"
    day: "D5"
    status: "pending"
    title: "Pass Home/Primary canary and physical-device QA"
    exit:
      - "real provider end-to-end passes"
      - "iPhone cellular test passes"
      - "Android cellular test passes"
      - "desktop regression passes"
      - "concurrency smoke passes"

  - id: "R1-011"
    priority: "P0"
    day: "D6"
    status: "in_progress"
    title: "Pass security, migration, restore and rollback"
    exit:
      - "critical/high findings equal zero"
      - "backup restore passes"
      - "rollback completes within 10 minutes"
      - "existing data remains readable"

  - id: "R1-012"
    priority: "P0"
    day: "D7"
    status: "pending"
    title: "Freeze exact RC and obtain owner decision"
    exit:
      - "CI green on RC commit"
      - "canary checksum equals candidate checksum"
      - "P0 and P1 equal zero"
      - "owner decision recorded as GO"

  - id: "R1-013"
    priority: "P0"
    day: "GO_LIVE"
    status: "pending"
    title: "Switch production and observe"
    exit:
      - "public mandatory journey passes"
      - "cellular smoke passes"
      - "four-hour observation passes"
      - "release evidence finalized"

