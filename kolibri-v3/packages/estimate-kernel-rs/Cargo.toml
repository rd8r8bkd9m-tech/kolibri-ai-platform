[package]
name = "kolibri-estimate-kernel"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Proprietary"
description = "Deterministic, side-effect-free Kolibri estimate calculation kernel"
publish = false

[lib]
name = "kolibri_estimate_kernel"
path = "src/lib.rs"

[[bin]]
name = "kolibri-estimate-kernel"
path = "src/main.rs"

[dependencies]
rust_decimal = { version = "=1.42.1", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

