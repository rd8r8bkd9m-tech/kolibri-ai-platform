[package]
name = "kolibri-storage-executor"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Proprietary"
description = "Fail-closed privileged storage executor for Kolibri nodes"
publish = false

[lib]
name = "kolibri_storage_executor"
path = "src/lib.rs"

[[bin]]
name = "kolibri-storage-executor"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std"] }
hex = "=0.4.3"
libc = "=0.2.174"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.8"
thiserror = "=2.0.12"

[dev-dependencies]
tempfile = "=3.20.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

